<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" style="background-color:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#173B65" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3182CE" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#718096" />
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Actors on Top -->
  <!-- ACT-01 Requester -->
  <g transform="translate(50, 20)">
    <rect x="0" y="0" width="220" height="95" rx="8" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="35" cy="35" r="14" fill="#173B65"/>
    <path d="M 17 68 A 18 16 0 0 1 53 68 Z" fill="#173B65"/>
    <text x="65" y="32" fill="#087E8B" font-size="13" font-weight="bold">ACT-01 [Person]</text>
    <text x="65" y="52" fill="#172333" font-size="14" font-weight="bold">ผู้ทำของหาย</text>
    <text x="65" y="72" fill="#718096" font-size="12">ค้นหา / ยื่นหลักฐาน</text>
  </g>
  <line x1="160" y1="115" x2="240" y2="220" stroke="#173B65" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ACT-02 Finder -->
  <g transform="translate(300, 20)">
    <rect x="0" y="0" width="220" height="95" rx="8" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="35" cy="35" r="14" fill="#173B65"/>
    <path d="M 17 68 A 18 16 0 0 1 53 68 Z" fill="#173B65"/>
    <text x="65" y="32" fill="#087E8B" font-size="13" font-weight="bold">ACT-02 [Person]</text>
    <text x="65" y="52" fill="#172333" font-size="14" font-weight="bold">ผู้พบของ (Finder)</text>
    <text x="65" y="72" fill="#718096" font-size="12">แจ้งเบาะแสไม่ระบุตัวตน</text>
  </g>
  <line x1="410" y1="115" x2="430" y2="220" stroke="#173B65" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ACT-03 Staff -->
  <g transform="translate(550, 20)">
    <rect x="0" y="0" width="220" height="95" rx="8" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="35" cy="35" r="14" fill="#173B65"/>
    <path d="M 17 68 A 18 16 0 0 1 53 68 Z" fill="#173B65"/>
    <text x="65" y="32" fill="#087E8B" font-size="13" font-weight="bold">ACT-03 [Person]</text>
    <text x="65" y="52" fill="#172333" font-size="14" font-weight="bold">เจ้าหน้าที่ (Staff)</text>
    <text x="65" y="72" fill="#718096" font-size="12">ตรวจคำร้อง / เบลอร์ภาพ / คืนของ</text>
  </g>
  <line x1="660" y1="115" x2="600" y2="220" stroke="#173B65" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ACT-04 Admin -->
  <g transform="translate(800, 20)">
    <rect x="0" y="0" width="220" height="95" rx="8" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="35" cy="35" r="14" fill="#173B65"/>
    <path d="M 17 68 A 18 16 0 0 1 53 68 Z" fill="#173B65"/>
    <text x="65" y="32" fill="#087E8B" font-size="13" font-weight="bold">ACT-04 [Person]</text>
    <text x="65" y="52" fill="#172333" font-size="14" font-weight="bold">ผู้ดูแลระบบ (IT Admin)</text>
    <text x="65" y="72" fill="#718096" font-size="12">กำหนดสิทธิ์ RBAC / ตรวจ Audit</text>
  </g>
  <line x1="910" y1="115" x2="780" y2="220" stroke="#173B65" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- System Boundary -->
  <rect x="40" y="180" width="1020" height="880" rx="12" fill="none" stroke="#173B65" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="60" y="1040" fill="#173B65" font-size="18" font-weight="bold">Campus Lost and Found System [Software System Boundary]</text>

  <!-- Container 1: Web Application -->
  <g transform="translate(80, 220)" filter="url(#shadow)">
    <rect x="0" y="0" width="820" height="155" rx="8" fill="#F1F7FA" stroke="#008699" stroke-width="2.5"/>
    <text x="25" y="35" fill="#173B65" font-size="22" font-weight="bold">Web Application</text>
    <text x="25" y="60" fill="#087E8B" font-size="15" font-weight="bold">[Container: เว็บแอปในเบราว์เซอร์ Responsive · React]</text>
    <text x="25" y="90" fill="#172333" font-size="14">หน้าค้นหารายการของที่พบ · ฟอร์มแจ้งเบาะแส · ฟอร์มแจ้งของหาย · ยื่นหลักฐาน · คิวตรวจคำร้องและจัดการคลังของ Staff</text>
    <text x="25" y="115" fill="#172333" font-size="14">แสดงผลแบบ Responsive Web (NFR-CLF-02) แสดงเมนูตามบทบาท (NFR-CLF-01) — แต่ไม่ใช่ที่ตัดสินสิทธิ์จริง (DEC-01)</text>
    
    <rect x="630" y="110" width="170" height="30" rx="15" fill="#FFFFFF" stroke="#008699" stroke-width="1.5"/>
    <text x="715" y="130" text-anchor="middle" fill="#087E8B" font-size="12" font-weight="bold">หน้าจอออกแบบใน W12</text>
  </g>

  <!-- Arrow Web to API -->
  <line x1="490" y1="375" x2="490" y2="460" stroke="#173B65" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="170" y="405" width="640" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="490" y="424" text-anchor="middle" fill="#173B65" font-size="13" font-weight="bold">เรียก API: ค้นหา · แจ้งเบาะแส · ส่งคำร้อง/หลักฐาน · ตรวจสอบ · บันทึกคืน [REST/JSON · HTTPS]</text>

  <!-- Container 2: API Application -->
  <g transform="translate(80, 460)" filter="url(#shadow)">
    <rect x="0" y="0" width="820" height="240" rx="8" fill="#F1F7FA" stroke="#008699" stroke-width="2.5"/>
    <text x="25" y="35" fill="#173B65" font-size="22" font-weight="bold">API Application</text>
    <text x="25" y="60" fill="#087E8B" font-size="15" font-weight="bold">[Container: โปรแกรมฝั่ง server · Node.js + Express]</text>
    
    <!-- Badges -->
    <circle cx="710" cy="35" r="14" fill="#008699"/>
    <text x="710" y="40" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">D1</text>
    <circle cx="745" cy="35" r="14" fill="#173B65"/>
    <text x="745" y="40" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">D2</text>
    <circle cx="780" cy="35" r="14" fill="#D89715"/>
    <text x="780" y="40" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">D3</text>

    <g font-size="14" fill="#172333">
      <text x="25" y="92">• กติกา BR-CLF-01 (เบลอร์ภาพ/เซ็นเซอร์ข้อมูลส่วนบุคคล) และ NFR-CLF-01 (ตรวจสิทธิ์ RBAC ทุก Action) อยู่ที่นี่ที่เดียว</text>
      <text x="25" y="120">• ควบคุม State Machine: ตรึงคำร้องเป็น Pending เสมอ ป้องกันสวมรอย (D2) ก่อน Staff กดยืนยัน</text>
      <text x="25" y="148">• ตรวจขนาดไฟล์แนบหลักฐาน ≤ 10MB (FR-CLF-04) และแยก Public API ออกจาก Private Proof API อย่างชัดเจน</text>
      <text x="25" y="176">• บันทึก Audit Log ทุกครั้งที่มีการเปลี่ยนสถานะรับเข้า-จ่ายออกลงฐานข้อมูล (D3)</text>
      <text x="25" y="204">• จัดการ In-app Notification แจ้งเตือนสถานะคำร้อง (FR-CLF-07)</text>
    </g>

    <rect x="700" y="195" width="100" height="30" rx="15" fill="#FFFFFF" stroke="#008699" stroke-width="1.5"/>
    <text x="750" y="215" text-anchor="middle" fill="#087E8B" font-size="12" font-weight="bold">DEC-01</text>
  </g>

  <!-- Arrow API to DB -->
  <line x1="280" y1="700" x2="280" y2="790" stroke="#173B65" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="280" y="750" text-anchor="middle" fill="#173B65" font-size="12" font-weight="bold">SQL / Transactions</text>

  <!-- Arrow API to File Storage -->
  <line x1="700" y1="700" x2="700" y2="790" stroke="#173B65" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="700" y="750" text-anchor="middle" fill="#173B65" font-size="12" font-weight="bold">Secure Stream / Multipart</text>

  <!-- Container 3: Database -->
  <g transform="translate(80, 790)" filter="url(#shadow)">
    <rect x="0" y="0" width="400" height="190" rx="8" fill="#F1F7FA" stroke="#008699" stroke-width="2.5"/>
    <text x="25" y="35" fill="#173B65" font-size="20" font-weight="bold">Database</text>
    <text x="25" y="58" fill="#087E8B" font-size="14" font-weight="bold">[Container: ฐานข้อมูลเชิงสัมพันธ์ · PostgreSQL]</text>
    <text x="25" y="88" fill="#172333" font-size="13">เก็บข้อมูล DR-01 ถึง DR-04 · แหล่งเดียวของ State</text>
    <text x="25" y="110" fill="#172333" font-size="13">และ Audit Log รองรับ ACID Transaction (D2, D3)</text>
    <text x="25" y="132" fill="#172333" font-size="13">เพื่อให้การเปลี่ยนสถานะและ Audit เกิดพร้อมกัน</text>
    
    <rect x="290" y="145" width="90" height="28" rx="14" fill="#FFFFFF" stroke="#008699" stroke-width="1.5"/>
    <text x="335" y="164" text-anchor="middle" fill="#087E8B" font-size="11" font-weight="bold">DEC-02</text>
  </g>

  <!-- Container 4: File Storage -->
  <g transform="translate(500, 790)" filter="url(#shadow)">
    <rect x="0" y="0" width="400" height="190" rx="8" fill="#F1F7FA" stroke="#008699" stroke-width="2.5"/>
    <text x="25" y="35" fill="#173B65" font-size="20" font-weight="bold">File Storage</text>
    <text x="25" y="58" fill="#087E8B" font-size="14" font-weight="bold">[Container: ที่เก็บไฟล์ปลอดภัย · Secure Object Storage]</text>
    <text x="25" y="88" fill="#172333" font-size="13">เก็บรูปถ่ายสิ่งของที่เบลอร์แล้ว (Public)</text>
    <text x="25" y="110" fill="#172333" font-size="13">และไฟล์หลักฐานยืนยันตน (DR-02 Private ≤ 10MB)</text>
    <text x="25" y="132" fill="#172333" font-size="13">ป้องกัน Direct URL เข้าถึงผ่าน Authorized Stream เท่านั้น</text>
  </g>

  <!-- External Systems on Right -->
  <!-- EXT-01: Identity Service -->
  <g transform="translate(1180, 440)">
    <rect x="0" y="0" width="360" height="140" rx="8" fill="#EBF4FF" stroke="#3182CE" stroke-width="2" filter="url(#shadow)"/>
    <text x="180" y="32" text-anchor="middle" fill="#2B6CB0" font-size="16" font-weight="bold">EXT-01: Institutional Identity Service</text>
    <rect x="65" y="45" width="230" height="22" rx="4" fill="#FED7D7"/>
    <text x="180" y="60" text-anchor="middle" fill="#9B2C2C" font-size="11" font-weight="bold">Core Boundary · TBD / DD-01</text>
    <text x="180" y="90" text-anchor="middle" fill="#4A5568" font-size="13">ระบบยืนยันตัวตนมหาวิทยาลัย (SSO)</text>
    <text x="180" y="112" text-anchor="middle" fill="#718096" font-size="12">ส่ง User Reference และ Role Claims (Staff/Student)</text>
  </g>
  <line x1="900" y1="510" x2="1170" y2="510" stroke="#3182CE" stroke-width="2.5" stroke-dasharray="6 4" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="1035" y="495" text-anchor="middle" fill="#2B6CB0" font-size="12" font-weight="bold">คำขอ Auth [TBD / DD-01]</text>

  <!-- EXT-02: Notification Service -->
  <g transform="translate(1180, 660)">
    <rect x="0" y="0" width="360" height="140" rx="8" fill="#F7FAFC" stroke="#718096" stroke-width="2" filter="url(#shadow)"/>
    <text x="180" y="32" text-anchor="middle" fill="#4A5568" font-size="16" font-weight="bold">EXT-02: External Notification Service</text>
    <rect x="65" y="45" width="230" height="22" rx="4" fill="#FEFCBF"/>
    <text x="180" y="60" text-anchor="middle" fill="#975A16" font-size="11" font-weight="bold">Extension · In-app First / DD-03</text>
    <text x="180" y="90" text-anchor="middle" fill="#4A5568" font-size="13">บริการแจ้งเตือนภายนอก (Email / LINE Notify)</text>
    <text x="180" y="112" text-anchor="middle" fill="#718096" font-size="12">ส่งข้อความเมื่อสถานะคำร้องเปลี่ยน (FR-CLF-07)</text>
  </g>
  <line x1="900" y1="730" x2="1170" y2="730" stroke="#718096" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <text x="1035" y="715" text-anchor="middle" fill="#718096" font-size="12" font-weight="bold">ส่ง Notification Event [DD-03]</text>

</svg>